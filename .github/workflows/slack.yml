name: Slack Notifications

on:
  workflow_run:
    workflows: ["CI Pipeline"]  # name of your CI workflow
    types: [completed]

jobs:
  slack-message:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build message
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            STATUS="SUCCESS :white_check_mark:"
          else
            STATUS="FAILED :x:"
          fi

          MESSAGE="CI Status: $STATUS\nBranch: ${{ github.event.workflow_run.head_branch }}\nRun: ${{ github.event.workflow_run.html_url }}"
          echo "SLACK_MESSAGE=$MESSAGE" >> $GITHUB_ENV

      - name: Send to Slack
        env:
          SLACK_MESSAGE: ${{ env.SLACK_MESSAGE }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: sh .github/scripts/slackpost.sh


name: CI Pipeline

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "hotfix/**"
      - "release/**"

  pull_request:
    branches:
      - develop
      - main

jobs:

  # Linting Job

  lint:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install flake8
        run: pip install flake8

      - name: Install black
        run: pip install black

      - name: Run flake8
        run: flake8 battlesnakes


  # Build Job

  build:
    name: Build Python project
    runs-on: ubuntu-latest
    needs: lint   # Run after lint succeeds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r battlesnakes/requirements.txt

      - name: Verify project builds
        run: python -m compileall battlesnake


  # Test Job

  test:
    name: Run Python tests
    runs-on: ubuntu-latest
    needs: build   # Run after build succeeds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r battlesnakes/requirements.txt

      - name: Run tests with unittest
        run: python -m unittest battlesnakes.tests


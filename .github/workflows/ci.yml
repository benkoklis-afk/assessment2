name: CI — Lint / Build / Test

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  # -------------------
  # Lint Job
  # -------------------
  lint:
    name: Run flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 linting
        run: |
          flake8 --max-line-length=110 .

  # -------------------
  # Build Job
  # -------------------
  build:
    name: Install dependencies (Build)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f battlesnakes/requirements.txt ]; then pip install -r battlesnakes/requirements.txt; fi

  # -------------------
  # Test Job
  # -------------------
  test:
    name: Run unittest and Notify Slack
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f battlesnakes/requirements.txt ]; then pip install -r battlesnakes/requirements.txt; fi

      - name: Run unit tests and capture output
        id: unittest
        run: |
          mkdir -p test-reports
          python -m unittest discover -s battlesnakes -p "tests.py" -v > test-reports/output.log 2>&1 || echo "Tests failed"

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="SUCCESS"
          if grep -q "FAILED" test-reports/output.log; then
            STATUS="FAILURE"
          fi
          # Truncate output to first 50 lines to avoid huge messages
          LOG=$(head -n 50 test-reports/output.log | sed 's/"/\\"/g' | tr '\n' '\\n')
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"CI job for branch ${{ github.ref_name }} finished with status: $STATUS\\n\`\`\`$LOG\`\`\`\"}" \
            $SLACK_WEBHOOK_URL

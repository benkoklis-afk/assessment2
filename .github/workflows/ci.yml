name: CI — Lint / Build / Test

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Run flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 linting
        run: |
          flake8 --max-line-length=110 .

  build:
    name: Install dependencies (Build)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f battlesnakes/requirements.txt ]; then pip install -r battlesnakes/requirements.txt; fi

  test:
    name: Run pytest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f battlesnakes/requirements.txt ]; then pip install -r battlesnakes/requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: |
          pytest -q

name: Deploy to Heroku  # Workflow name

on:
  workflow_run:         # Trigger this workflow after another workflow completes
    workflows: ["Docker Build & Push"]   # <-- The workflow you defined that builds/pushes Docker
    types:
      - completed        # Only when that workflow has finished

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # Only run if previous workflow succeeded
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        # We need the code (or just Dockerfile) for context, though main work happens via CLI

      - name: Install Heroku CLI
        # Heroku CLI lets us run commands like pushing image, releasing app
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Login to Heroku Container Registry
        # If you're deploying via Docker image rather than code
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:login
       # Tag the image for Heroku and push to the “web” process
      - name: Push Docker image to Heroku
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |

          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/battlesnakes:latest registry.heroku.com/${HEROKU_APP_NAME}/web
          docker push registry.heroku.com/${HEROKU_APP_NAME}/web

      - name: Release the image on Heroku
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:release web --app $HEROKU_APP_NAME

      - name: Verify deployment status
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          heroku ps --app $HEROKU_APP_NAME

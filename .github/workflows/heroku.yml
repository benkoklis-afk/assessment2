name: Deploy to Heroku  # Workflow name

on:
  workflow_run:         # Trigger this workflow after another workflow completes
    workflows: ["Docker Build & Push"]   # <-- The workflow you defined that builds/pushes Docker
    types:
      - completed        # Only when that workflow has finished


jobs:
  deploy:
    # Only run if CI was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install Heroku CLI
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      # Login to Heroku Container Registry via CLI
      - name: Login to Heroku Container Registry
        # HEROKU_API_KEY is needed by Heroku CLI
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:login

      # Pull your Docker image from Docker Hub
      - name: Pull Docker image from Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/battlesnakes:latest

      # Tag the image for Heroku deployment
      - name: Release Docker image on Heroku
        run: |
         heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}
        env:
         HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      # Push image to Heroku Container Registry
      - name: Push image to Heroku
        run: |
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web

      # Release the new version on Heroku
      - name: Release Docker image on Heroku
        run: |
          heroku container:release web \
            --app ${{ secrets.HEROKU_APP_NAME }} \
            --apikey ${{ secrets.HEROKU_API_KEY }}

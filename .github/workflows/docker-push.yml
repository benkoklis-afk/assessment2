name: Docker BUild & Push
# Triggered after the CI workflow completes
on:
  workflow_run:
    workflows: ["CI Pipeline"]  # name of your CI workflow
    types: [completed]

jobs:
  docker:
    # Only run if the CI workflow concluded successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up QEMU (optional for multi-arch)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image, Add tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
           ${{ secrets.DOCKERHUB_USERNAME }}/battlesnakes:latest
           ${{ secrets.DOCKERHUB_USERNAME }}/battlesnakes:${{ github.sha }}
